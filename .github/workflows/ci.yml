name: ci
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# Needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

# A force-push should not leave a full matrix running on the superseded commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ci ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One failing job should not hide the results of the others
      fail-fast: false
      matrix:
        version:
          # The minimum version declared in Project.toml, so that the compat
          # bound is tested
          - '1.10'
          - '1.12'
        os:
          - ubuntu-latest
          # There is a concurrency limit for MacOS runners across the
          # entire organization.
          # (see https://docs.github.com/en/actions/reference/limits#job-concurrency-limits-for-github-hosted-runners)
          # To help with this, MacOS runners are only run when PRs are merged
          # into the main branch.
          - ${{ github.event_name == 'push' && 'macos-latest' || '' }}
        exclude:
          - os: ''
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        # Coverage from one entry in the matrix is enough
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{secrets.CODECOV_TOKEN}}
