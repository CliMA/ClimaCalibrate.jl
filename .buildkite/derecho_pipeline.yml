agents:
  queue: derecho
  modules: climacommon/2026_04_08
  pbs_q: develop
  pbs_l_select: "1:ncpus=1"

env:
  OPENBLAS_NUM_THREADS: 1
  SLURM_KILL_BAD_EXIT: 1
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/default"

steps:
  - label: "init :computer:"
    key: "init_cpu_env"
    command:
      - echo "--- Instantiate project"
      - julia --project -e 'using Pkg; Pkg.instantiate(;verbose=true)'
      - echo "--- Instantiate SurfaceFluxes calibration project"
      - julia --project=experiments/surface_fluxes_perfect_model -e 'using Pkg; Pkg.develop(; path = "."); Pkg.instantiate(;verbose=true)'

  - wait

  # The two calibrations are separate steps so that a failure in one is not
  # hidden by the other never running, and so that a retry does not repeat the
  # half that passed. Each test clears the output directory it writes to.
  - label: "SurfaceFluxes calibration on the WorkerBackend"
    command: julia --project=experiments/surface_fluxes_perfect_model test/worker_backend.jl
    artifact_paths: "output/surface_fluxes_perfect_model/**/*"
    # These tests submit scheduler jobs, which fail when the queue is busy
    # enough that a job does not start within the test's wait. One retry covers
    # that; marking the step soft-failing would instead report a green build for
    # a `calibrate`, `submit_job`, or `job_status` failure as well, which is how
    # a broken submission went unnoticed.
    retry:
      automatic:
        - exit_status: "*"
          limit: 1

  - label: "SurfaceFluxes calibration on the HPCBackend"
    command: julia --project=experiments/surface_fluxes_perfect_model test/hpc_backend.jl
    artifact_paths: "output/surface_fluxes_perfect_model/**/*"
    # These tests submit scheduler jobs, which fail when the queue is busy
    # enough that a job does not start within the test's wait. One retry covers
    # that; marking the step soft-failing would instead report a green build for
    # a `calibrate`, `submit_job`, or `job_status` failure as well, which is how
    # a broken submission went unnoticed.
    retry:
      automatic:
        - exit_status: "*"
          limit: 1

  - label: "PBS job controller unit tests"
    command: julia --project=experiments/surface_fluxes_perfect_model test/pbs_unit_tests.jl
    # These tests submit scheduler jobs, which fail when the queue is busy
    # enough that a job does not start within the test's wait. One retry covers
    # that; marking the step soft-failing would instead report a green build for
    # a `calibrate`, `submit_job`, or `job_status` failure as well, which is how
    # a broken submission went unnoticed.
    retry:
      automatic:
        - exit_status: "*"
          limit: 1

  - label: "PBSManager tests"
    command: julia --project=experiments/surface_fluxes_perfect_model test/pbs_manager_unit_tests.jl
